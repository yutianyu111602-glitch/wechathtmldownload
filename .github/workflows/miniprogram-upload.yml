name: miniprogram-upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version string for upload
        required: true
        default: '2026.06.10.1'
      desc:
        description: Upload description
        required: false
        default: 'weekly activity experience version'

concurrency:
  group: miniprogram-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: windows-latest
    environment: miniprogram-upload

    steps:
      - uses: actions/checkout@v6

      - name: DevTools smoke (rendered)
        run: pwsh ./scripts/miniprogram/devtools-smoke.ps1 -Mode rendered

      - name: DevTools smoke (firstload)
        run: pwsh ./scripts/miniprogram/devtools-smoke.ps1 -Mode firstload

      - name: Upload experience version
        run: pwsh ./scripts/miniprogram/upload-experience.ps1 -Version "${{ inputs.version }}" -Desc "${{ inputs.desc }}"
