name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
        python: ['3.11']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Node deps
        run: npm run bootstrap

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: CloudRun tests
        run: npm run test:cloudrun

      - name: Mini program tests
        run: npm run test:miniprogram

      - name: Weekly package validation
        run: npm run validate:weekly-package

      - name: Consistency check
        run: npm run check:current-release

      - uses: actions/upload-artifact@v7
        with:
          name: verify-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            reports/**
