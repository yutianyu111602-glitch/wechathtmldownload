site_name: wechathtmldownload Docs
site_description: Markdown documentation site for the active wechathtmldownload line.
site_url: ""
docs_dir: docs
site_dir: ../../docs/projects/wechathtmldownload
use_directory_urls: false
exclude_docs: |
  vendor/**
  **/*.html
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
plugins:
  - search:
      lang:
        - en
        - zh
validation:
  nav:
    omitted_files: ignore
nav:
  - 入口: index.md
  - 当前状态:
      - 当前运行入口: current-runtime.md
      - 七线程总路由: threads/THREADS_INDEX_20260522.md
      - Atlas 与小程序说人话版总结: ATLAS_MINIPROGRAM_HUMAN_SUMMARY_20260525.md
      - Sound Scout 接入方案: ATLAS_MINIPROGRAM_SOUND_SCOUT_INTEGRATION_20260525.md
      - Atlas 与小程序当前架构核对: ATLAS_MINIPROGRAM_CURRENT_PROGRESS_CODE_ARCHITECTURE_20260525.md
      - 两天长跑调度提示词: threads/THREAD_DISPATCH_PROMPTS_2DAY_LONGRUN_20260523.md
      - T1 Source Intake / Docker Exporter: threads/T1_source_intake_docker_exporter_20260522.md
      - T2 Weekly Backend Release: threads/T2_weekly_backend_release_20260522.md
      - T3 Mini-Program Frontend: threads/T3_mini_program_frontend_20260522.md
      - T4 Atlas Activity Candidate: threads/T4_atlas_activity_candidate_20260522.md
      - T5 Atlas DJ Serving Graph: threads/T5_atlas_dj_serving_graph_20260522.md
      - T6 DeepSeekTUI / LDR Sidecar: threads/T6_deepseektui_ldr_sidecar_20260522.md
      - T7 Docs / SSOT Control: threads/T7_docs_ssot_control_20260522.md
      - Atlas 社交搜索 SSOT: ATLAS_SOCIAL_SEARCH_RULES_SSOT_20260521.md
      - Atlas 最终目标计划: superpowers/plans/2026-05-21-atlas-full-production-final-goals.md
      - 图鉴当前权威: ELECTRONIC_MUSIC_GRAPH_CURRENT_AUTHORITY_20260518.md
      - 图鉴阶段地图: ELECTRONIC_MUSIC_GRAPH_PIPELINE_STAGE_MAP_20260518.md
      - 图鉴最终完成计划: ELECTRONIC_MUSIC_ATLAS_FINAL_COMPLETION_PLAN_20260519.md
      - 图鉴生产收尾控制包: longrun/atlas-production-autofinish-20260519/manifest.md
      - 图鉴生产证据图: longrun/atlas-production-autofinish-20260519/evidence-map.md
      - 图鉴长跑计划: ELECTRONIC_MUSIC_GRAPH_FULL_PRODUCTION_LONGRUN_PLAN_20260518.md
      - 项目 README: project-current/ROOT_README.md
      - 项目 AGENTS: project-current/AGENTS.md
      - 项目状态: PROJECT_STATUS_2026-05-07.md
      - 文档索引: DOCUMENTATION_INDEX.md
      - 当前代码地图: CURRENT_CODE_MAP.md
      - 运行手册: RUNBOOK.md
  - 操作:
      - 配置: CONFIGURATION.md
      - CLI: CLI_REFERENCE.md
      - 模型策略: MODEL_POLICY.md
      - 代码审计: CODE_AUDIT.md
  - Stage7:
      - Current Stage7 SSOT: stage7-current/STAGE7_SSOT_20260514.md
